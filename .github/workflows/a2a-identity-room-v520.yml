name: AI2AI Identity Room v5.2 smoke

on:
  pull_request:
    paths:
      - "deploy/a2a-v5/identity-room-v5.2.py"
      - "deploy/a2a-v5/install-identity-room-v5.2.sh"
      - ".github/workflows/a2a-identity-room-v520.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python syntax
        run: python3 -m py_compile deploy/a2a-v5/identity-room-v5.2.py
      - name: Installer syntax
        run: bash -n deploy/a2a-v5/install-identity-room-v5.2.sh
      - name: Identity-room invariants
        run: |
          grep -q 'VERSION = "5.2.0"' deploy/a2a-v5/identity-room-v5.2.py
          grep -q 'range(100)' deploy/a2a-v5/identity-room-v5.2.py
          grep -q 'item.get("in", 0).*< 3' deploy/a2a-v5/identity-room-v5.2.py
          grep -q 'item.get("out", 0).*< 3' deploy/a2a-v5/identity-room-v5.2.py
          grep -q '21600' deploy/a2a-v5/identity-room-v5.2.py
          grep -q '604800' deploy/a2a-v5/identity-room-v5.2.py
          grep -q 'RND_V5_DISCUSSION_ROOM=' deploy/a2a-v5/install-identity-room-v5.2.sh
          grep -q 'OnUnitActiveSec=6h' deploy/a2a-v5/install-identity-room-v5.2.sh
          grep -q 'max 3/day' deploy/a2a-v5/install-identity-room-v5.2.sh
