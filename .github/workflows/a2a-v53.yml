name: A2A v5.5.2 resilient evidence regression

on:
  pull_request:
    paths:
      - "deploy/a2a-v5/**"
      - "projects/technocore-did-onboarding/**"
      - ".github/workflows/a2a-v53.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2a-v552-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: V5.5 convergence and evidence suite
        run: |
          bash deploy/a2a-v5/test-a2a-suite-v5.5.sh

      - name: Deterministic Evidence and Merkle unit tests
        run: |
          python3 deploy/a2a-v5/test_evidence_v55.py

      - name: Offline integration and E2E artifact
        run: |
          python3 deploy/a2a-v5/test_v55_integration.py
          python3 deploy/a2a-v5/test_v551_recovery.py
          python3 deploy/a2a-v5/demo_v55.py --output /tmp/a2a-v55-demo
          test -s /tmp/a2a-v55-demo/evidence-bundle.json
          test -s /tmp/a2a-v55-demo/artifact.md

      - name: V5.5 installer safety
        run: |
          python3 -m pip install --disable-pip-version-check "cryptography==46.0.3"
          python3 deploy/a2a-v5/test_existing_did_quickstart_v1.py
          python3 deploy/a2a-v5/test_existing_did_quickstart_installer_v1.py
          python3 deploy/a2a-v5/test_verifiable_evidence_installer_v55.py
          python3 deploy/a2a-v5/test_verifiable_evidence_installer_v551.py
          python3 deploy/a2a-v5/test_verifiable_evidence_installer_v552.py
          bash -n deploy/a2a-v5/install-verifiable-evidence-v5.5.1.sh
          bash -n deploy/a2a-v5/install-verifiable-evidence-v5.5.2.sh
          bash -n deploy/a2a-v5/install-existing-did-quickstart-v1.sh

      - name: Standalone DID onboarding wizard
        run: |
          python3 -m unittest discover -s projects/technocore-did-onboarding/tests -p 'test_*.py'
          bash -n projects/technocore-did-onboarding/install.sh
          bash projects/technocore-did-onboarding/install.sh --check \
            --source-dir projects/technocore-did-onboarding

      - name: Love8 pinned peer invitation bridge
        run: |
          python3 deploy/a2a-v5/test_love8_peer_bridge_v243.py

      - name: Aizong byte-safe workflow wire
        run: |
          python3 deploy/a2a-v5/aizong-wire-v34/test_aizong_wire_v34.py

      - name: AI2AI wire and research room
        run: |
          python3 deploy/a2a-v5/test_wire_room_v31.py

      - name: Curator cursor reliability
        run: |
          python3 deploy/a2a-v5/test_curator_reliability_v51.py

      - name: Aizong signed evidence mirrors
        run: |
          python3 deploy/a2a-v5/test_aizong_evidence_mirror_v35.py

      - name: Research context and cadence
        run: |
          sudo -E "$(command -v python3)" deploy/a2a-v5/test_research_context_v32.py
          sudo -E "$(command -v python3)" deploy/a2a-v5/test_research_cadence_v321.py

      - name: Rollback-safe installer coverage
        run: |
          sudo -E "$(command -v python3)" deploy/a2a-v5/test_research_installer_v32.py
          sudo -E "$(command -v python3)" deploy/a2a-v5/test_research_cadence_installer_v321.py
