name: Legacy social installer smoke

on:
  pull_request:
    paths:
      - 'scripts/install_aizong_social.sh'
      - 'scripts/test_legacy_social_install.sh'
      - '.github/workflows/legacy-social-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check legacy migration installer
        run: bash scripts/test_legacy_social_install.sh
