name: aizong Social v1.4.2 memory consolidation smoke

on:
  pull_request:
    paths:
      - "scripts/aizong_social.py"
      - "scripts/patch_aizong_social_v130.py"
      - "scripts/patch_aizong_social_v131.py"
      - "scripts/patch_aizong_social_v140.py"
      - "scripts/patch_aizong_social_v141.py"
      - "scripts/patch_aizong_social_v142.py"
      - "scripts/upgrade_aizong_social_v141.sh"
      - "scripts/upgrade_aizong_social_v142.sh"
      - "scripts/test_aizong_social_v142.py"
      - ".github/workflows/aizong-social-v142.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-consolidation-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python syntax
        run: |
          python3 -m py_compile scripts/patch_aizong_social_v142.py scripts/test_aizong_social_v142.py
      - name: Memory consolidation behavior
        run: python3 scripts/test_aizong_social_v142.py
      - name: Upgrade script syntax
        run: bash -n scripts/upgrade_aizong_social_v142.sh
      - name: Memory invariants
        run: |
          grep -q 'TC_MEMORY_HISTORY_LIMIT=6' scripts/upgrade_aizong_social_v142.sh
          grep -q 'TC_MEMORY_DAILY_SYNC_CAP=2' scripts/upgrade_aizong_social_v142.sh
          grep -q 'TC_MEMORY_SYNC_MIN_INTERVAL=14400' scripts/upgrade_aizong_social_v142.sh
          grep -q 'TC_MEMORY_DURABLE_NS=aizong-memory' scripts/upgrade_aizong_social_v142.sh
          grep -q 'server note itself is NOT authenticated' scripts/upgrade_aizong_social_v142.sh
          grep -q 'Never invent a public memory' scripts/patch_aizong_social_v142.py
          grep -q 'aizong-memory-checkpoint' scripts/patch_aizong_social_v142.py
